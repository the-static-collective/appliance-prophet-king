name: NuToaster 003 - Hypothetical P0 to vanilla Minecraft
on:
  push:
    branches: [003-nutoaster-provisional-dimensions]
    paths:
      - 'prototype-003-provisional/**'
      - '.github/workflows/nutoaster-provisional-003.yml'
  pull_request:
    paths:
      - 'prototype-003-provisional/**'
      - '.github/workflows/nutoaster-provisional-003.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  hypothetical-blueprint:
    name: Vanilla Minecraft ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: '1.20.1'
            java: '17'
          - target: '26.1.1'
            java: '25'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Verify provisional provenance and bounded geometry
        run: |
          python3 -m unittest discover -s prototype-003-provisional/tests -p 'test_generate.py' -v
          python3 prototype-003-provisional/generate.py /tmp/p0-build
          unzip -t "/tmp/p0-build/NuToaster_003_Provisional_Java_${{ matrix.target }}.zip"
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - name: Download official Mojang Minecraft server / verify published SHA-1
        env:
          MINECRAFT_TARGET: ${{ matrix.target }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request,os
          p=Path('/tmp/p0-vanilla');p.mkdir(parents=True,exist_ok=True)
          target=os.environ['MINECRAFT_TARGET']
          m=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json',timeout=30))
          version=next(v for v in m['versions'] if v['id']==target)
          meta=json.load(urllib.request.urlopen(version['url'],timeout=30))
          source=meta['downloads']['server']
          raw=urllib.request.urlopen(source['url'],timeout=90).read()
          assert hashlib.sha1(raw).hexdigest()==source['sha1'],'Mojang JAR SHA-1 mismatch'
          (p/'server.jar').write_bytes(raw)
          print('MOJANG_SHA1_VERIFIED',target,source['sha1'])
          PY
      - name: Launch new offline flat creative server with provisional datapack
        run: |
          set -euo pipefail
          cd /tmp/p0-vanilla
          mkdir -p world/datapacks
          cp "/tmp/p0-build/NuToaster_003_Provisional_Java_${{ matrix.target }}.zip" world/datapacks/NuToaster_P0.zip
          echo 'eula=true' > eula.txt
          cat > server.properties <<'PROPERTIES'
          server-port=25565
          online-mode=false
          enforce-secure-profile=false
          gamemode=creative
          force-gamemode=true
          difficulty=peaceful
          spawn-protection=0
          level-type=minecraft:flat
          generate-structures=false
          view-distance=5
          simulation-distance=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=nutoaster-p0-ci-only
          enable-query=false
          motd=NuToaster-P0-Temporary-CI
          PROPERTIES
          java -Xms512M -Xmx2G -jar server.jar nogui > minecraft.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 150); do
            if grep -q 'Done (' minecraft.log; then echo 'MINECRAFT_READY';exit 0;fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then tail -120 minecraft.log;exit 1;fi
            sleep 1
          done
          tail -120 minecraft.log;exit 1
      - name: Verify native Java world geometry and non-physical press modes
        run: |
          NUTOASTER_TEST_RCON=nutoaster-p0-ci-only python3 prototype-003-provisional/tests/vanilla_smoke.py
      - name: Store source hypothesis and game logs without binary server
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nutoaster-003-${{ matrix.target }}-test
          path: |
            /tmp/p0-build/SOURCE_HYPOTHETICAL_DIMENSIONS.json
            /tmp/p0-vanilla/minecraft.log
          if-no-files-found: warn
          retention-days: 7
