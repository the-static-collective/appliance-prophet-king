name: NuToaster 002 - Concept model to official Minecraft Java
on:
  push:
    branches:
      - 002-nutoaster-minecraft-cartridge
    paths:
      - 'prototype-002-minecraft/**'
      - '.github/workflows/nutoaster-minecraft-002.yml'
  pull_request:
    paths:
      - 'prototype-002-minecraft/**'
      - '.github/workflows/nutoaster-minecraft-002.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  concept-and-game:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Check semantics, nonclaims, deterministic datapack
        run: |
          python3 -m unittest discover -s prototype-002-minecraft/tests -p 'test_*.py' -v
          python3 prototype-002-minecraft/generate.py /tmp/apk-build
          unzip -t /tmp/apk-build/NuToaster_001_Minecraft_Concept_Java_26.1.1.zip
      - uses: actions/setup-java@dded0888837ed1f317902acf8a20df0ad188d165
        with:
          distribution: temurin
          java-version: '25'
      - name: Download Mojang 26.1.1 server and verify published SHA-1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,urllib.request
          p=Path('/tmp/apk-vanilla');p.mkdir(parents=True,exist_ok=True)
          m=json.load(urllib.request.urlopen('https://piston-meta.mojang.com/mc/game/version_manifest_v2.json',timeout=30))
          version=next(v for v in m['versions'] if v['id']=='26.1.1')
          meta=json.load(urllib.request.urlopen(version['url'],timeout=30))
          source=meta['downloads']['server']
          raw=urllib.request.urlopen(source['url'],timeout=60).read()
          assert hashlib.sha1(raw).hexdigest()==source['sha1'],'Mojang SHA-1 mismatch'
          (p/'server.jar').write_bytes(raw)
          print('Official Mojang Java 26.1.1 SHA1 verified',source['sha1'])
          PY
      - name: Start empty creative server with concept datapack
        run: |
          set -euo pipefail
          cd /tmp/apk-vanilla
          mkdir -p world/datapacks
          cp /tmp/apk-build/NuToaster_001_Minecraft_Concept_Java_26.1.1.zip world/datapacks/nutoaster.zip
          echo 'eula=true' > eula.txt
          cat > server.properties <<'PROPERTIES'
          server-port=25565
          online-mode=false
          enforce-secure-profile=false
          gamemode=creative
          force-gamemode=true
          difficulty=peaceful
          spawn-protection=0
          level-type=minecraft:flat
          generate-structures=false
          view-distance=5
          simulation-distance=5
          enable-rcon=true
          rcon.port=25575
          rcon.password=nutoaster-test-only
          enable-query=false
          motd=NuToaster-Concept-Test-Disposable
          PROPERTIES
          java -Xms512M -Xmx2G -jar server.jar nogui > minecraft.log 2>&1 &
          echo $! > server.pid
          for i in $(seq 1 120); do
            if grep -q 'Done (' minecraft.log; then echo 'MINECRAFT_READY';exit 0;fi
            if ! kill -0 "$(cat server.pid)" 2>/dev/null; then tail -100 minecraft.log;exit 1;fi
            sleep 1
          done
          tail -100 minecraft.log;exit 1
      - name: Verify two in-game bays, heat symbols and pressure-control display
        run: |
          NUTOASTER_TEST_RCON=nutoaster-test-only python3 prototype-002-minecraft/tests/vanilla_smoke.py
      - name: Preserve source manifest and game log only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: nutoaster-002-disposable-minecraft-evidence
          path: |
            /tmp/apk-build/SOURCE_CONCEPT.json
            /tmp/apk-vanilla/minecraft.log
          retention-days: 7
          if-no-files-found: warn
